name: SheetORM CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Upgrade npm to v11
        run: corepack enable && corepack prepare npm@11 --activate

      - name: Install dependencies
        run: npm ci

      - name: Knip (unused deps/code detection)
        run: npm run knip

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Verify Code.js exists
        run: test -f Code.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Upgrade npm to v11
        run: corepack enable && corepack prepare npm@11 --activate

      - run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy vulnerability scanner on lockfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          # This project has only devDependencies (no runtime deps),
          # so dev deps must be included or nothing is scanned.
          args: --include-dev-deps --skip-dirs build/,build-test/,dist/,node_modules/,tmp/
