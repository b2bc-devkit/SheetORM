name: Run Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build_lint:
    runs-on: ubuntu-latest
    name: Build & Lint
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: "npm"
      - name: Upgrade npm to v11
        run: corepack enable && corepack prepare npm@11 --activate
      - name: Install Dependencies
        run: npm ci
      - name: Knip (unused deps/code detection)
        run: npm run knip
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  trivy:
    runs-on: ubuntu-latest
    name: Trivy CVE Scan
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Run Trivy vulnerability scanner on lockfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: false
          # This project has only devDependencies (no runtime deps),
          # so dev deps must be included or nothing is scanned.
          args: --include-dev-deps --skip-dirs build/,build-test/,dist/,node_modules/,tmp/
