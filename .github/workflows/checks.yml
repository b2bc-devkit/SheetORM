name: Run Checks

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build_lint:
    runs-on: ubuntu-latest
    name: Build & Lint
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Upgrade npm to v11
        run: corepack enable && corepack prepare npm@11 --activate
      - name: Install Dependencies
        run: npm ci
      - name: Knip (unused deps/code detection)
        run: npm run knip
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build

  trivy:
    runs-on: ubuntu-latest
    name: Trivy CVE Scan
    steps:
      - name: Fetch Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
      - name: Upgrade npm to v11
        run: corepack enable && corepack prepare npm@11 --activate
      - name: Install Dependencies
        run: npm ci
      - name: Cache Trivy binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy-scan
          key: trivy-scan-${{ runner.os }}
      - name: Run Trivy vulnerability scanner
        run: npm run trivy:scan
        env:
          TRIVY_SCAN_VERSION: pinned
